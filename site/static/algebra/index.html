    <script>
        // --- Data Bank ---
        const courseData = [
          {
            id: 'functions',

            description: 'Understanding domains, ranges, inverse functions, and compositions.',
            questions: [
              { id: 'f1_1', level: 1, text: 'What is the domain of $f(x) = \\frac{1}{x-2}$?', options: ['$x = 2$', '$x \\neq 2$', 'All real numbers', '$x > 0$'], correct: 1, explanation: 'Division by zero is undefined, so the denominator $x-2$ cannot be equal to $0$. Therefore, $x \\neq 2$.', searchQuery: 'how to find the domain of a rational function' },
              { id: 'f1_2', level: 1, text: 'Which statement best describes a mathematical function?', options: ['Any relation between $x$ and $y$', 'A relation where each $x$ has exactly one $y$', 'A relation where each $y$ has exactly one $x$', 'A curve that crosses the x-axis twice'], correct: 1, explanation: 'By definition, a function pairs every input ($x$) with exactly one output ($y$).', searchQuery: 'definition of a mathematical function relation' },
              { id: 'f1_3', level: 1, text: 'Evaluate $f(-2)$ for $f(x) = 3x^2 - x + 4$.', options: ['$18$', '$14$', '$10$', '$22$'], correct: 0, explanation: 'Substitute -2 into the function: $3(-2)^2 - (-2) + 4 = 3(4) + 2 + 4 = 12 + 2 + 4 = 18$.', searchQuery: 'evaluating functions at specific values' },
              { id: 'f1_4', level: 1, text: 'Which test is used to determine if a graph represents a function?', options: ['Horizontal Line Test', 'First Derivative Test', 'Vertical Line Test', 'Root Test'], correct: 2, explanation: 'The Vertical Line Test visually checks if any $x$-value maps to more than one $y$-value.', searchQuery: 'vertical line test for functions' },
              { id: 'f1_5', level: 1, text: 'If $f(x) = |x - 3|$, what is $f(1)$?', options: ['$-2$', '$2$', '$4$', '$-4$'], correct: 1, explanation: 'Substitute $1$: $|1 - 3| = |-2| = 2$.', searchQuery: 'evaluating absolute value functions' },
              { id: 'f2_1', level: 2, text: 'Find $f(g(x))$ if $f(x) = 2x$ and $g(x) = x + 3$.', options: ['$2x + 3$', '$x + 6$', '$2x + 6$', '$3x + 3$'], correct: 2, explanation: 'Substitute $g(x)$ into $f(x)$: $f(x+3) = 2(x+3) = 2x + 6$.', searchQuery: 'composition of functions f(g(x))' },
              { id: 'f2_2', level: 2, text: 'Find the inverse function $f^{-1}(x)$ for $f(x) = 3x - 1$.', options: ['$\\frac{x - 1}{3}$', '$\\frac{x + 1}{3}$', '$-3x + 1$', '$\\frac{1}{3x-1}$'], correct: 1, explanation: 'Swap $x$ and $y$, then solve for $y$: $x = 3y - 1 \\implies x + 1 = 3y \\implies y = \\frac{x + 1}{3}$.', searchQuery: 'how to find the inverse of a linear function' },
              { id: 'f2_3', level: 2, text: 'Find the domain of $f(x) = \\frac{x+1}{x^2 - 9}$.', options: ['$x \\neq 3, -3$', '$x \\neq 3$', '$x \\neq -1$', 'All real numbers'], correct: 0, explanation: 'The denominator cannot be zero. $x^2 - 9 = 0 \\implies (x-3)(x+3) = 0$, so $x \\neq 3$ and $x \\neq -3$.', searchQuery: 'domain of rational functions with quadratic denominator' },
              { id: 'f2_4', level: 2, text: 'Set up the difference quotient $\\frac{f(x+h)-f(x)}{h}$ for $f(x) = 4x$.', options: ['$\\frac{4x+h - 4x}{h}$', '$\\frac{4(x+h) - 4x}{h}$', '$\\frac{4x+4h}{h}$', '$\\frac{x+h - x}{h}$'], correct: 1, explanation: 'Substitute $(x+h)$ into $f(x)$ for the first term: $f(x+h) = 4(x+h)$.', searchQuery: 'setting up the difference quotient' },
              { id: 'f2_5', level: 2, text: 'Is the function $f(x) = x^3 + x$ even, odd, or neither?', options: ['Even', 'Odd', 'Neither', 'Both'], correct: 1, explanation: 'Test $f(-x)$: $(-x)^3 + (-x) = -x^3 - x = -(x^3 + x) = -f(x)$. Since $f(-x) = -f(x)$, it is odd.', searchQuery: 'determining even and odd functions algebraically' },
              { id: 'f3_1', level: 3, text: 'What is the range of $f(x) = -x^2 + 4$?', options: ['$y \\geq 4$', '$y \\leq 4$', 'All real numbers', '$y \\neq 4$'], correct: 1, explanation: 'The function represents a downward-opening parabola with its vertex at $(0, 4)$. Thus, the maximum value is $4$, making the range $y \\leq 4$.', searchQuery: 'how to find the range of a quadratic function parabola' },
              { id: 'f3_2', level: 3, text: 'Determine the domain of $f(x) = \\sqrt{x - 5}$.', options: ['$x \\leq 5$', '$x \\neq 5$', 'All real numbers', '$x \\geq 5$'], correct: 3, explanation: 'The expression inside a square root must be non-negative for the function to return a real number. So, $x - 5 \\geq 0 \\implies x \\geq 5$.', searchQuery: 'domain of a square root function' },
              { id: 'f3_3', level: 3, text: 'Find the inverse function of $f(x) = \\frac{2x}{x-1}$.', options: ['$y = \\frac{x}{x-2}$', '$y = \\frac{x-1}{2x}$', '$y = \\frac{2x}{x+1}$', '$y = \\frac{x}{2x-1}$'], correct: 0, explanation: 'Swap $x$ and $y$: $x = \\frac{2y}{y-1} \\implies x(y-1) = 2y \\implies xy - x = 2y \\implies xy - 2y = x \\implies y(x-2) = x \\implies y = \\frac{x}{x-2}$.', searchQuery: 'finding the inverse of a rational function' },
              { id: 'f3_4', level: 3, text: 'Simplify the difference quotient $\\frac{f(x+h)-f(x)}{h}$ for $f(x) = x^2$.', options: ['$2x + h$', '$2x$', '$x^2 + h$', '$2x + h^2$'], correct: 0, explanation: '$\\frac{(x+h)^2 - x^2}{h} = \\frac{x^2 + 2xh + h^2 - x^2}{h} = \\frac{2xh + h^2}{h} = 2x + h$.', searchQuery: 'simplifying difference quotient for quadratic function' },
              { id: 'f3_5', level: 3, text: 'Find the domain of $f(g(x))$ if $f(x) = \\frac{1}{x}$ and $g(x) = \\sqrt{x-2}$.', options: ['$x > 2$', '$x \\geq 2$', '$x \\neq 0$', '$x \\neq 2$'], correct: 0, explanation: 'First, $g(x)$ requires $x \\geq 2$. Then, $f(g(x)) = \\frac{1}{\\sqrt{x-2}}$ requires the denominator to not be zero, meaning $x-2 > 0 \\implies x > 2$.', searchQuery: 'finding domain of composite functions' }
            ]
          },
          {
            id: 'systems',
            title: 'Linear Functions & Systems',
            description: 'Slopes, linear equations, and systems of multiple variables.',
            questions: [
              { id: 's1_1', level: 1, text: 'What is the slope of the line passing through $(1, 2)$ and $(4, 8)$?', options: ['$2$', '$\\frac{1}{2}$', '$-2$', '$6$'], correct: 0, explanation: 'Slope $m = \\frac{y_2 - y_1}{x_2 - x_1} = \\frac{8 - 2}{4 - 1} = \\frac{6}{3} = 2$.', searchQuery: 'how to find the slope between two points' },
              { id: 's1_2', level: 1, text: 'Solve for $x$: $3x - 4 = 11$', options: ['$4$', '$5$', '$\\frac{7}{3}$', '$15$'], correct: 1, explanation: 'Add $4$ to both sides: $3x = 15$. Divide by $3$: $x = 5$.', searchQuery: 'solving basic two step linear equations' },
              { id: 's1_3', level: 1, text: 'Find the x-intercept of the line $4x - 3y = 12$.', options: ['$3$', '$-4$', '$4$', '$-3$'], correct: 0, explanation: 'The x-intercept occurs where $y=0$. Substitute $y=0$: $4x - 0 = 12 \\implies x = 3$.', searchQuery: 'finding x and y intercepts of linear equations' },
              { id: 's1_4', level: 1, text: 'What is true about the slopes of parallel lines?', options: ['They are negative reciprocals', 'They multiply to 1', 'They are equal', 'They sum to 0'], correct: 2, explanation: 'Parallel lines never intersect because they rise and run at the exact same rate, meaning their slopes are equal.', searchQuery: 'slopes of parallel lines' },
              { id: 's1_5', level: 1, text: 'If a system of linear equations has parallel lines, how many solutions does it have?', options: ['One', 'Infinitely many', 'None', 'Two'], correct: 2, explanation: 'A solution is a point of intersection. Since parallel lines never intersect, there are no solutions (an inconsistent system).', searchQuery: 'number of solutions to linear systems parallel lines' },
              { id: 's2_1', level: 2, text: 'Solve the system: $x + y = 10$ and $x - y = 2$', options: ['$x=4, y=6$', '$x=8, y=2$', '$x=6, y=4$', '$x=5, y=5$'], correct: 2, explanation: 'Add the two equations: $(x+y) + (x-y) = 10 + 2 \\implies 2x = 12 \\implies x = 6$. Substituting back gives $y = 4$.', searchQuery: 'solving a system of linear equations by elimination' },
              { id: 's2_2', level: 2, text: 'Write the equation of the line perpendicular to $y = \\frac{1}{2}x + 3$ passing through $(0, 0)$.', options: ['$y = 2x$', '$y = -\\frac{1}{2}x$', '$y = -2x$', '$y = \\frac{1}{2}x$'], correct: 2, explanation: 'Perpendicular lines have negative reciprocal slopes. The original slope is $\\frac{1}{2}$, so the new slope is $-2$. The y-intercept is $0$, so $y = -2x$.', searchQuery: 'equation of a perpendicular line passing through a point' },
              { id: 's2_3', level: 2, text: 'Solve the system: $y = 2x - 5$ and $3x + 2y = 4$.', options: ['$x=2, y=-1$', '$x=3, y=1$', '$x=1, y=-3$', '$x=2, y=1$'], correct: 0, explanation: 'Substitute the first into the second: $3x + 2(2x-5) = 4 \\implies 3x + 4x - 10 = 4 \\implies 7x = 14 \\implies x = 2$. Then $y = 2(2) - 5 = -1$.', searchQuery: 'solving systems of linear equations by substitution' },
              { id: 's2_4', level: 2, text: 'Add the matrices: $\\begin{bmatrix} 1 & 2 \\\\ 3 & 4 \\end{bmatrix} + \\begin{bmatrix} 5 & 0 \\\\ 1 & -1 \\end{bmatrix}$.', options: ['$\\begin{bmatrix} 6 & 2 \\\\ 4 & 3 \\end{bmatrix}$', '$\\begin{bmatrix} 5 & 0 \\\\ 3 & -4 \\end{bmatrix}$', '$\\begin{bmatrix} 6 & 2 \\\\ 2 & 5 \\end{bmatrix}$', '$\\begin{bmatrix} 4 & 2 \\\\ 2 & 5 \\end{bmatrix}$'], correct: 0, explanation: 'Add corresponding elements: $1+5=6$, $2+0=2$, $3+1=4$, $4+(-1)=3$.', searchQuery: 'adding matrices' },
              { id: 's2_5', level: 2, text: 'Determine the nature of the system: $2x + y = 5$ and $4x + 2y = 10$.', options: ['One solution', 'No solutions', 'Infinitely many solutions', 'Two solutions'], correct: 2, explanation: 'Dividing the second equation by 2 yields $2x + y = 5$, identical to the first. These are the same line, hence dependent with infinite solutions.', searchQuery: 'dependent and independent systems of equations' },
              { id: 's3_1', level: 3, text: 'Evaluate the determinant of the $2 \\times 2$ matrix with top row $(3, 4)$ and bottom row $(1, 2)$.', options: ['$10$', '$2$', '$-2$', '$5$'], correct: 1, explanation: 'Determinant $= (ad - bc) = (3)(2) - (4)(1) = 6 - 4 = 2$.', searchQuery: 'how to evaluate the determinant of a 2x2 matrix' },
              { id: 's3_2', level: 3, text: 'Solve the system: $2x + 3y = 12$ and $x - y = 1$', options: ['$x=3, y=2$', '$x=4, y=3$', '$x=2, y=3$', '$x=3, y=-2$'], correct: 0, explanation: 'From the second equation, $x = y + 1$. Substitute into the first: $2(y+1) + 3y = 12 \\implies 5y + 2 = 12 \\implies 5y = 10 \\implies y = 2$. Then $x = 3$.', searchQuery: 'solving a system of linear equations by substitution' },
              { id: 's3_3', level: 3, text: 'Solve the 3-variable system: $x+y+z=6$, $2x-y+z=3$, and $x+2y-z=2$.', options: ['$x=1, y=2, z=3$', '$x=2, y=1, z=3$', '$x=1, y=3, z=2$', '$x=3, y=2, z=1$'], correct: 0, explanation: 'Adding the first and third equations eliminates $z$: $2x + 3y = 8$. Subtracting the second from the first gives $-x + 2y = 3$. Solving this 2x2 system yields $x=1, y=2$. Substituting back gives $z=3$.', searchQuery: 'solving systems of three linear equations' },
              { id: 's3_4', level: 3, text: "Use Cramer's Rule to find $x$ for the system: $2x-y=4$, $x+y=5$. What is $D_x$ (the $x$-determinant)?", options: ['$9$', '$3$', '$-9$', '$1$'], correct: 0, explanation: "The $x$-determinant $D_x$ replaces the $x$-column with the constants. Top row $(4, -1)$, bottom row $(5, 1)$. Determinant = $4(1) - (-1)(5) = 4 + 5 = 9$.", searchQuery: 'cramers rule solving linear systems determinants' },
              { id: 's3_5', level: 3, text: 'Solve the non-linear system: $y = x^2$ and $y = x + 2$.', options: ['$(1, 1)$ and $(2, 4)$', '$(2, 4)$ and $(-1, 1)$', '$(0, 0)$ and $(2, 4)$', '$(-2, 4)$ and $(1, 3)$'], correct: 1, explanation: 'Set them equal: $x^2 = x + 2 \\implies x^2 - x - 2 = 0 \\implies (x-2)(x+1) = 0$. So $x=2$ and $x=-1$. Plugging back in gives $y=4$ and $y=1$.', searchQuery: 'solving non linear systems of equations parabola line' }
            ]
          },
          {
            id: 'quadratics',
            title: 'Quadratic Functions',
            description: 'Factoring, the quadratic formula, and parabolic behavior.',
            questions: [
              { id: 'q1_1', level: 1, text: 'What are the roots of $(x-3)(x+4)=0$?', options: ['$x=3, -4$', '$x=-3, 4$', '$x=3, 4$', '$x=-3, -4$'], correct: 0, explanation: 'Set each factor to zero: $x-3=0 \\implies x=3$ and $x+4=0 \\implies x=-4$.', searchQuery: 'finding roots of a factored quadratic equation' },
              { id: 'q1_2', level: 1, text: 'Identify the vertex of the parabola $y = (x-1)^2 + 5$.', options: ['$(-1, 5)$', '$(1, 5)$', '$(1, -5)$', '$(0, 5)$'], correct: 1, explanation: 'For vertex form $y = a(x-h)^2 + k$, the vertex is $(h, k)$. Here, $h=1$ and $k=5$.', searchQuery: 'finding the vertex of a parabola in vertex form' },
              { id: 'q1_3', level: 1, text: 'Expand the binomial square: $(2x - 3)^2$.', options: ['$4x^2 - 12x + 9$', '$4x^2 - 9$', '$4x^2 + 12x + 9$', '$2x^2 - 12x + 9$'], correct: 0, explanation: 'Use the pattern $(a-b)^2 = a^2 - 2ab + b^2$. Here $a=2x$ and $b=3$, so $(2x)^2 - 2(2x)(3) + (3)^2 = 4x^2 - 12x + 9$.', searchQuery: 'expanding binomial squares' },
              { id: 'q1_4', level: 1, text: 'What is the y-intercept of $f(x) = 3x^2 - 4x + 7$?', options: ['$-4$', '$3$', '$7$', '$0$'], correct: 2, explanation: 'The y-intercept occurs where $x=0$. $f(0) = 3(0)^2 - 4(0) + 7 = 7$.', searchQuery: 'finding the y intercept of a quadratic function' },
              { id: 'q1_5', level: 1, text: 'Find the axis of symmetry for $y = 2x^2 - 8x + 1$.', options: ['$x = 2$', '$x = -2$', '$x = 4$', '$x = 8$'], correct: 0, explanation: 'Use the formula $x = \\frac{-b}{2a}$. Here, $a=2$ and $b=-8$. $x = \\frac{-(-8)}{2(2)} = \\frac{8}{4} = 2$.', searchQuery: 'finding the axis of symmetry of a parabola' },
              { id: 'q2_1', level: 2, text: 'Factor the expression completely: $x^2 - 7x + 12$.', options: ['$(x-3)(x-4)$', '$(x+3)(x+4)$', '$(x-2)(x-6)$', '$(x-1)(x-12)$'], correct: 0, explanation: 'We need two numbers that multiply to $12$ and add to $-7$. These are $-3$ and $-4$.', searchQuery: 'factoring a quadratic expression trinomial' },
              { id: 'q2_2', level: 2, text: 'Find the discriminant of $x^2 + 4x + 5 = 0$.', options: ['$36$', '$4$', '$-4$', '$-16$'], correct: 2, explanation: 'The discriminant is $\\Delta = b^2 - 4ac = (4)^2 - 4(1)(5) = 16 - 20 = -4$.', searchQuery: 'how to find the discriminant of a quadratic equation' },
              { id: 'q2_3', level: 2, text: 'Write $y = x^2 - 6x + 5$ in vertex form.', options: ['$y = (x-3)^2 - 4$', '$y = (x+3)^2 - 4$', '$y = (x-3)^2 + 4$', '$y = (x-6)^2 - 31$'], correct: 0, explanation: 'Complete the square: $y = (x^2 - 6x + 9) - 9 + 5 \\implies y = (x-3)^2 - 4$.', searchQuery: 'completing the square to find vertex form' },
              { id: 'q2_4', level: 2, text: 'What is the sum of the roots of the equation $2x^2 - 10x + 3 = 0$?', options: ['$-5$', '$5$', '$\\frac{3}{2}$', '$10$'], correct: 1, explanation: "By Vieta's formulas, the sum of the roots of $ax^2 + bx + c = 0$ is $\\frac{-b}{a}$. So, $\\frac{-(-10)}{2} = 5$.", searchQuery: 'sum and product of roots of quadratic equations vietas formulas' },
              { id: 'q2_5', level: 2, text: 'Solve the quadratic inequality: $x^2 - 9 < 0$.', options: ['$x < 3$', '$x > -3$', '$-3 < x < 3$', '$x < -3$ or $x > 3$'], correct: 2, explanation: 'Factor to get $(x-3)(x+3) < 0$. The roots are $3$ and $-3$. Testing intervals shows the expression is negative between $-3$ and $3$.', searchQuery: 'solving quadratic inequalities' },
              { id: 'q3_1', level: 3, text: 'Solve using the quadratic formula: $2x^2 - 5x + 2 = 0$.', options: ['$x = 2, \\frac{1}{2}$', '$x = -2, -\\frac{1}{2}$', '$x = 5, 2$', '$x = 1, 2$'], correct: 0, explanation: '$x = \\frac{5 \\pm \\sqrt{25 - 16}}{4} = \\frac{5 \\pm 3}{4}$. This gives $\\frac{8}{4}=2$ and $\\frac{2}{4}=\\frac{1}{2}$.', searchQuery: 'solving quadratic equations using the quadratic formula' },
              { id: 'q3_2', level: 3, text: 'Write the quadratic function with vertex $(0, 0)$ passing through $(2, 8)$.', options: ['$y = 4x^2$', '$y = 2x^2$', '$y = x^2 + 4$', '$y = 8x^2$'], correct: 1, explanation: 'Vertex $(0,0)$ means $y = ax^2$. Substitute $(2,8)$: $8 = a(2)^2 \\implies 8 = 4a \\implies a = 2$. So $y = 2x^2$.', searchQuery: 'finding the equation of a parabola given the vertex and a point' },
              { id: 'q3_3', level: 3, text: "A projectile's height is $h(t) = -16t^2 + 64t + 80$. At what time $t$ does it hit the ground?", options: ['$5$', '$4$', '$2$', '$8$'], correct: 0, explanation: 'Set $h(t) = 0$ and divide by $-16$: $0 = t^2 - 4t - 5$. Factoring gives $(t-5)(t+1) = 0$. Since time must be positive, $t = 5$.', searchQuery: 'projectile motion quadratic equations word problems' },
              { id: 'q3_4', level: 3, text: 'Find the complex roots of $x^2 - 4x + 13 = 0$.', options: ['$2 \\pm 3i$', '$-2 \\pm 3i$', '$4 \\pm 9i$', '$2 \\pm 9i$'], correct: 0, explanation: 'Quadratic formula: $x = \\frac{4 \\pm \\sqrt{16 - 52}}{2} = \\frac{4 \\pm \\sqrt{-36}}{2} = \\frac{4 \\pm 6i}{2} = 2 \\pm 3i$.', searchQuery: 'complex roots of quadratic equations quadratic formula' },
              { id: 'q3_5', level: 3, text: 'A farmer has $400$ ft of fencing for a rectangular field against a river (no fence needed on one side). What is the maximum area?', options: ['$10,000$ sq ft', '$20,000$ sq ft', '$40,000$ sq ft', '$8,000$ sq ft'], correct: 1, explanation: 'Perimeter: $2x + y = 400 \\implies y = 400 - 2x$. Area $A = x(400 - 2x) = 400x - 2x^2$. Max at $x = \\frac{-400}{2(-2)} = 100$. Max Area = $100(200) = 20,000$.', searchQuery: 'quadratic optimization word problems max area' }
            ]
          },
          {
            id: 'polynomials',
            title: 'Polynomial Functions',
            description: 'Operations with polynomials, factoring, root theorems, and end behavior.',
            questions: [
              { id: 'p1_1', level: 1, text: 'Simplify: $(2x^2 - 3x + 1) + (x^2 + 4x - 5)$.', options: ['$3x^2 + x - 4$', '$3x^2 - 7x - 4$', '$2x^2 + x - 4$', '$3x^2 + 7x + 6$'], correct: 0, explanation: 'Combine like terms: $(2x^2 + x^2) + (-3x + 4x) + (1 - 5) = 3x^2 + x - 4$.', searchQuery: 'adding and subtracting polynomials' },
              { id: 'p1_2', level: 1, text: 'Identify the degree of $P(x) = 4x^5 - 2x^3 + 7x - 1$.', options: ['$5$', '$4$', '$3$', '$1$'], correct: 0, explanation: 'The degree of a polynomial is the highest power of the variable $x$. Here, it is 5.', searchQuery: 'finding the degree of a polynomial' },
              { id: 'p1_3', level: 1, text: 'Evaluate $P(-1)$ for $P(x) = x^3 - 2x^2 + 5$.', options: ['$2$', '$8$', '$4$', '$6$'], correct: 0, explanation: 'Substitute $-1$ for $x$: $(-1)^3 - 2(-1)^2 + 5 = -1 - 2(1) + 5 = -1 - 2 + 5 = 2$.', searchQuery: 'evaluating polynomials' },
              { id: 'p1_4', level: 1, text: 'Simplify: $(5x^3 - 2x) - (3x^3 + 4x)$.', options: ['$2x^3 - 6x$', '$2x^3 + 2x$', '$8x^3 + 2x$', '$2x^3 - 2x$'], correct: 0, explanation: 'Distribute the negative and combine: $5x^3 - 3x^3 - 2x - 4x = 2x^3 - 6x$.', searchQuery: 'subtracting polynomials' },
              { id: 'p1_5', level: 1, text: 'Multiply: $2x(x^2 - 3x + 4)$.', options: ['$2x^3 - 6x^2 + 8x$', '$2x^3 - 3x + 4$', '$2x^2 - 6x + 8$', '$2x^3 - 6x^2 + 4$'], correct: 0, explanation: 'Distribute $2x$ to each term inside the parentheses.', searchQuery: 'multiplying a polynomial by a monomial' },
              { id: 'p2_1', level: 2, text: 'Factor out the greatest common factor: $6x^4 - 9x^3 + 12x^2$.', options: ['$3x^2(2x^2 - 3x + 4)$', '$3x(2x^3 - 3x^2 + 4x)$', '$6x^2(x^2 - 1.5x + 2)$', '$x^2(6x^2 - 9x + 12)$'], correct: 0, explanation: 'The GCF of the coefficients is 3, and for the variables it is $x^2$. Factoring $3x^2$ out leaves $2x^2 - 3x + 4$.', searchQuery: 'factoring greatest common factor polynomials' },
              { id: 'p2_2', level: 2, text: 'Factor by grouping: $x^3 + 2x^2 - 3x - 6$.', options: ['$(x^2 - 3)(x + 2)$', '$(x^2 + 3)(x - 2)$', '$(x^2 - 3)(x - 2)$', '$(x^2 + 2)(x - 3)$'], correct: 0, explanation: 'Group the first two and last two terms: $x^2(x + 2) - 3(x + 2) = (x^2 - 3)(x + 2)$.', searchQuery: 'factoring polynomials by grouping' },

        function renderMathText(text) {
            if (!text) return '';
            const parts = text.split('$');
            return parts.map((part, index) => {
                if (index % 2 !== 0) {
                    if (window.katex) {
                        try {
                            return window.katex.renderToString(part, { throwOnError: false });
                        } catch (e) {
                            return part;
                        }
                    }
                    return part; // Fallback if KaTeX isn't loaded
                }
                return part;
            }).join('');
        }

        function startGame() {
            gameState = 'topic_intro';
            render();

        function startTopic() {
            mastery = 0;
            currentLevel = 1;
            askedQuestions = [];
            pickNextQuestion(1, []);
            gameState = 'playing';
            render();
        }

        function pickNextQuestion(targetLevel, currentAsked) {
            const currentTopic = courseData[currentTopicIndex];
            let availableQuestions = currentTopic.questions.filter(q => !currentAsked.includes(q.id));

            if (availableQuestions.length === 0) {
                currentAsked = [];
                availableQuestions = currentTopic.questions;
            }

            let candidates = availableQuestions.filter(q => q.level === targetLevel);
            
            if (candidates.length === 0) {
                candidates = availableQuestions.sort((a, b) => Math.abs(a.level - targetLevel) - Math.abs(b.level - targetLevel));
            }

            currentQuestion = candidates[Math.floor(Math.random() * candidates.length)];
            selectedAnswer = null;
            isCorrect = null;
        }

        function handleAnswerSubmit(optionIndex) {
            if (gameState === 'feedback') return; // Prevent clicking during feedback

            selectedAnswer = optionIndex;
            isCorrect = (optionIndex === currentQuestion.correct);
            
            let pointsEarned = 0;
            let nextLevel = currentLevel;

            if (isCorrect) {
                pointsEarned = currentQuestion.level;
                nextLevel = Math.min(3, currentLevel + 1);
                totalScore += (currentQuestion.level * 10);
            } else {
                nextLevel = Math.max(1, currentLevel - 1);
            }

            mastery += pointsEarned;
            currentLevel = nextLevel;
            askedQuestions.push(currentQuestion.id);
            
            gameState = 'feedback';
            render();
        }

        function handleNext() {
            if (mastery >= MASTERY_TARGET) {
                if (currentTopicIndex + 1 < courseData.length) {
                    currentTopicIndex++;
                    gameState = 'topic_intro';
                } else {
                    gameState = 'completed';
                }
            } else {
                pickNextQuestion(currentLevel, askedQuestions);
                gameState = 'playing';
            }
            render();
        }

                let optionsHtml = currentQuestion.options.map((option, idx) => {
                    const isSelected = selectedAnswer === idx;
                    const isCorrectOption = idx === currentQuestion.correct;
                    
                    let btnStyle = "bg-white border-2 border-slate-200 hover:border-blue-400 text-slate-700 cursor-pointer";
                    let iconHtml = "";

                    if (gameState === 'feedback') {
                        btnStyle = "bg-white border-2 border-slate-200 text-slate-400 opacity-50 cursor-not-allowed"; // default inactive
                        if (isCorrectOption) {
                            btnStyle = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-medium cursor-default";
                            iconHtml = `<i data-lucide="check-circle-2" class="text-emerald-500 w-6 h-6"></i>`;
                        } else if (isSelected && !isCorrectOption) {
                            btnStyle = "bg-red-50 border-2 border-red-500 text-red-800 cursor-default";
                            iconHtml = `<i data-lucide="x-circle" class="text-red-500 w-6 h-6"></i>`;
                        }
                    } else if (isSelected) {
                        btnStyle = "bg-blue-50 border-2 border-blue-500 text-blue-800 font-medium";
                    }

                    return `
                        <button 
                            ${gameState === 'feedback' ? 'disabled' : ''} 
                            onclick="handleAnswerSubmit(${idx})"
                            class="w-full text-left px-6 py-4 rounded-xl transition-all flex justify-between items-center text-lg ${btnStyle}"
                        >
                            <span>${renderMathText(option)}</span>
                            ${iconHtml}
                        </button>
                    `;
                }).join('');

                let feedbackHtml = '';
                if (gameState === 'feedback') {
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(currentQuestion.searchQuery)}`;
                    const levelUpBanner = (mastery >= MASTERY_TARGET && isCorrect) ? `
                        <div class="bg-white p-4 rounded-xl border border-emerald-200 mb-6 flex items-center justify-between shadow-sm">
                            <div>
                                <p class="font-bold text-emerald-600 flex items-center gap-2">
                                    <i data-lucide="trophy" class="w-5 h-5"></i> Topic Mastered!
                                </p>
                                <p class="text-sm text-slate-500 mt-1">You're ready for the next chapter.</p>
                            </div>
                        </div>
                    ` : '';

                    feedbackHtml = `
                        <div class="p-6 sm:p-8 border-t-2 ${isCorrect ? 'bg-emerald-50 border-emerald-100' : 'bg-red-50 border-red-100'}">
                            <div class="flex items-start gap-4">
                                <div class="mt-1">
                                    <div class="${isCorrect ? 'bg-emerald-100' : 'bg-red-100'} p-2 rounded-full">
                                        <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="${isCorrect ? 'text-emerald-600' : 'text-red-600'} w-6 h-6"></i>
                                    </div>
                                </div>
                                <div class="flex-1">
                                    <h4 class="text-lg font-bold mb-2 ${isCorrect ? 'text-emerald-800' : 'text-red-800'}">
                                        ${isCorrect ? 'Correct!' : 'Not quite.'}
                                    </h4>
                                    <p class="text-slate-700 mb-6 leading-relaxed">
                                        ${renderMathText(currentQuestion.explanation)}
                                    </p>
                                    
                                    ${currentQuestion.searchQuery ? `
                                        <div class="mb-6">
                                            <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-blue-600 font-medium hover:text-blue-800 transition-colors bg-blue-50 px-4 py-2 rounded-lg border border-blue-100">
                                                <i data-lucide="search" class="w-5 h-5"></i>
                                                Search for help on this topic
                                            </a>
                                        </div>
                                    ` : ''}

                                    ${levelUpBanner}

                                    <button onclick="handleNext()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-slate-800 transition-colors flex items-center">
                                        ${mastery >= MASTERY_TARGET ? 'Continue to Next Chapter' : 'Next Question'}
                                        <i data-lucide="chevron-right" class="ml-2 w-5 h-5"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                const levelBadgeClass = currentQuestion.level === 1 ? 'bg-emerald-100 text-emerald-700' :
                                        currentQuestion.level === 2 ? 'bg-blue-100 text-blue-700' :
                                        'bg-purple-100 text-purple-700';

                html = `
                    <div class="p-4 sm:p-8 flex-1 flex flex-col items-center">
                        <header class="max-w-3xl w-full mb-8 flex items-center justify-between">
                            <div>
                                <h2 class="text-lg font-bold text-slate-800">${currentTopic.title}</h2>
                                <p class="text-sm text-slate-500 font-medium">Chapter ${currentTopicIndex + 1} &bull; Score: ${totalScore}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Mastery Progress</p>
                                <div class="flex items-center gap-3">
                                    <div class="w-32 bg-slate-200 rounded-full h-3 overflow-hidden border border-slate-300">
                                        <div class="bg-blue-600 h-3 rounded-full transition-all duration-500 ease-in-out" style="width: ${progress}%"></div>
                                    </div>
                                    <span class="text-sm font-bold text-slate-700">${Math.min(mastery, MASTERY_TARGET)}/${MASTERY_TARGET}</span>
                                </div>
                            </div>
                        </header>

                        <main class="max-w-3xl w-full flex-1 flex flex-col">
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col">
                                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider ${levelBadgeClass}">
                                        Level ${currentQuestion.level}
                                    </span>
                                </div>

                                <div class="p-6 sm:p-10 flex-1">
                                    <h3 class="text-2xl font-medium text-slate-900 mb-8 leading-snug">
                                        ${renderMathText(currentQuestion.text)}
                                    </h3>
                                    <div class="grid grid-cols-1 gap-4">
                                        ${optionsHtml}
                                    </div>
                                </div>

                                ${feedbackHtml}
                            </div>
                        </main>
                    </div>
                `;
            }

            root.innerHTML = html;
            // Re-initialize Lucide icons after manipulating DOM
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        // Initialize application once external scripts (like KaTeX) are ready
        window.addEventListener('DOMContentLoaded', () => {
            render();
        });

    </script>
</body>
</html>
